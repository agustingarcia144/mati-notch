name: Release (build check)

on:
  push:
    tags:
      - 'v*'

# Notarization is done locally with scripts/release.sh.
# This workflow only verifies the build compiles on a clean machine.
jobs:
  build-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd mati-notch && xcodegen

      - name: Build Release (no signing)
        run: |
          xcodebuild \
            -project mati-notch/mati-notch.xcodeproj \
            -scheme mati-notch \
            -configuration Release \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
